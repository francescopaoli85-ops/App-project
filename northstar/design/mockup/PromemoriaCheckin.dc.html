  a { color: inherit; text-decoration: none; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .rise1 { animation: fadeUp 0.5s ease both; }
  .rise2 { animation: fadeUp 0.5s ease 0.1s both; }

  @keyframes glowPulse { 0%,100% { box-shadow: 0 0 18px rgba(124,58,237,0.5); transform: scale(1); } 50% { box-shadow: 0 0 40px rgba(34,211,238,0.65); transform: scale(1.025); } }

  .tw1 { animation: twinkle 2s ease-in-out infinite; }
  .tw2 { animation: twinkle 2.6s ease-in-out infinite 0.5s; }
  @keyframes gradientShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  @keyframes driftPart { 0%,100% { transform: translateY(0) translateX(0); opacity: 0.25; } 50% { transform: translateY(-14px) translateX(5px); opacity: 0.9; } }
  .particle { position: absolute; border-radius: 50%; animation: driftPart ease-in-out infinite; }
  @keyframes shimmer { 0% { transform: translateX(-120%) skewX(-15deg); } 100% { transform: translateX(220%) skewX(-15deg); } }
  .shimmerWrap { position: relative; overflow: hidden; }
  .shimmerWrap::after { content: ""; position: absolute; top: 0; left: 0; width: 35%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent); animation: shimmer 3.4s ease-in-out infinite; }
