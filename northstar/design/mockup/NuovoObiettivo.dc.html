<style>
  body { margin: 0; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; background: #0F0920; color: #F1EEFC; }
  a { color: inherit; text-decoration: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(124,58,237,0.6); } 100% { box-shadow: 0 0 0 34px rgba(124,58,237,0); } }
  @keyframes pulse2 { 0% { box-shadow: 0 0 0 0 rgba(34,211,238,0.45); } 100% { box-shadow: 0 0 0 54px rgba(34,211,238,0); } }
  @keyframes bar { 0%,100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }

  .ring2 { animation: pulse2 1.3s ease-out 0.3s infinite; }
  @keyframes gradientShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .dot { transform-origin: left center; animation: dotPop 0.5s cubic-bezier(.2,.8,.2,1) both; }
  .dot:nth-child(1){animation-delay:.02s}.dot:nth-child(2){animation-delay:.1s}.dot:nth-child(3){animation-delay:.18s}
  .rise1 { animation: fadeUp 0.5s ease both; }
  .rise2 { animation: fadeUp 0.5s ease 0.12s both; }
  @keyframes badgePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(124,58,237,0.35); } 50% { box-shadow: 0 0 0 6px rgba(124,58,237,0); } }
  .badgeP { animation: badgePulse 2.2s ease-in-out infinite; }
</style>
